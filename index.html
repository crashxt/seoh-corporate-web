<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020814" />

    <title>SEOH DESIGN TECH S.A. — Plataforma modular para organizaciones</title>
    <meta
      name="description"
      content="Diseñamos y operamos software modular multi-tenant: condominios, mantenimiento, transporte, procesos y CRM sobre una base común. También equipamiento tecnológico y domótica."
    />
    <link rel="canonical" href="https://seohdesigntech.com/" />

    <!-- Iconos. El favicon anterior apuntaba al logo de 1,79 MB: cada pestaña
         abierta descargaba la imagen completa del hero. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tarjeta al compartir en WhatsApp, LinkedIn, X o Facebook. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="SEOH DESIGN TECH S.A." />
    <meta property="og:title" content="SEOH DESIGN TECH S.A. — Plataforma modular para organizaciones" />
    <meta
      property="og:description"
      content="Software modular multi-tenant para condominios, mantenimiento, transporte, procesos y CRM. Además, equipamiento tecnológico y domótica."
    />
    <meta property="og:url" content="https://seohdesigntech.com/" />
    <meta property="og:image" content="https://seohdesigntech.com/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SEOH DESIGN TECH — Diseñamos soluciones. Construimos confianza." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- La marca es el elemento mayor de la portada: adelantarla mejora el LCP. -->
    <link rel="preload" as="image" href="/brand/logo-hero-1100.webp" type="image/webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SEOH DESIGN TECH S.A.",
        "alternateName": "SEOH",
        "url": "https://seohdesigntech.com/",
        "logo": "https://seohdesigntech.com/brand/logo-header-800.webp",
        "slogan": "Diseñamos soluciones. Construimos confianza.",
        "description": "Plataforma modular multi-tenant y equipamiento tecnológico para organizaciones.",
        "address": { "@type": "PostalAddress", "addressCountry": "EC" },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "info@seohdesigntech.com",
          "availableLanguage": ["es"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
