name: Calidad

# Se ejecuta en cada propuesta de cambio y en cada publicación a main, para que
# nada llegue al sitio sin compilar.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # Los assets de marca se generan con scripts. Si alguien edita un script y
      # olvida regenerar, el sitio publicaría una versión antigua del logotipo
      # sin que nadie lo note.
      #
      # La comprobación mira dimensiones y peso con tolerancia, no los bytes.
      # Compararlos byte a byte hacía fallar esta rama sin que nada estuviera
      # mal: favicon-192.png es un PNG de paleta, y libimagequant no produce los
      # mismos bytes compilado en Windows que compilado en Ubuntu. Misma imagen,
      # mismo peso, bytes distintos. El razonamiento completo está en el script.
      - name: Comprobar que los assets estén regenerados
        run: npm run verificar-assets

      # Un enlace roto a un icono o al logotipo da un 404 en cada visita y pasa
      # desapercibido con facilidad: ya ocurrió una vez.
      - name: Comprobar referencias a assets
        run: |
          fallos=0
          for ref in $(grep -oE '/brand/[A-Za-z0-9._-]+' index.html public/site.webmanifest | grep -oE '/brand/[A-Za-z0-9._-]+' | sort -u); do
            if [ ! -f "public$ref" ]; then
              echo "::error::Referencia rota: $ref"
              fallos=1
            fi
          done
          exit $fallos
